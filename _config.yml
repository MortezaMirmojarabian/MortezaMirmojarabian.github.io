# ── Site ─────────────────────────────────────────────────────────
title: "Morteza Mirmojarabian"
tagline: "English teacher · Writer · Web tinkerer"
description: >-
  Articles on the English language, interactive exercises for learners,
  and handy web projects by Morteza Mirmojarabian.
url: "https://mortezamirmojarabian.github.io"
baseurl: ""

# ── Author / contact (CHANGE THESE) ──────────────────────────────
author:
  name: "Morteza Mirmojarabian"
  email: "you@example.com"                  # ← your email
  telegram: "https://t.me/your_username"    # ← your Telegram
  twitter: "your_x_handle"                  # ← X handle, without @

# ── Projects (Home page) ─────────────────────────────────────────
projects:
  - name: "HTML Editor"
    subtitle: "Online HTML Editor with Real-Time Preview"
    description: >-
      Edit your HTML, CSS, and JavaScript code and see your changes instantly
      with live preview. A handy tool for web developers, designers, and learners.
    url: "https://mortezamirmojarabian.github.io/html-editor/"
  - name: "ILI Teachers' Library"
    subtitle: "A library by teachers, for teachers"
    description: >-
      An exclusive, collaborative digital library of teaching resources
      curated by ILI teachers, for ILI teachers.
    url: "#"                                # ← real URL when ready

# ── Blog pagination ──────────────────────────────────────────────
paginate: 5
paginate_path: "/blog/page:num/"

permalink: /blog/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Morteza Mirmojarabian"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor