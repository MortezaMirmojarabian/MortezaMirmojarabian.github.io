# =============================================================================
#  Site settings
#  Edit the values below, commit, push - GitHub Pages rebuilds the site.
#  (When running Jekyll locally, restart `jekyll serve` after editing this file.)
# =============================================================================

# -- Identity -----------------------------------------------------------------
title: Morteza Mirmojarabian
short_name: Morteza                       # shown instead of the full name on small phones
tagline: Teaching English, building tools for learning
description: >-
  Articles on the English language, interactive exercises for learners,
  and the tools I build for teachers and students.
author:
  name: Morteza Mirmojarabian

# -- Contact & social: REPLACE THE THREE PLACEHOLDERS ---------------------------
telegram: MortezaMirmojarabian          # no "@"   ->  https://t.me/your_telegram_username
email: MortezaMirmojarabian@gmail.com
x_username: Mirmojarabian               # no "@"   ->  used by "Follow on X" and "Share on X"

# -- Address (GitHub Pages "user site") ---------------------------------------
url: "https://mortezamirmojarabian.github.io"
baseurl: ""
lang: en
timezone: Asia/Tehran

# -- Blog ---------------------------------------------------------------------
permalink: /blog/:title/
paginate: 5                               # posts per page
paginate_path: "/blog/page:num/"

# -- Build --------------------------------------------------------------------
# Only plugins that GitHub Pages allows out of the box.
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  # Default link-preview image (used on X, Telegram, etc.). Give a post its own
  # with `image: /assets/img/my-picture.png` in that post's front matter.
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - package.json
  - package-lock.json
