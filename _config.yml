# Site identity
# Update the contact/social/project URLs below before publishing.
title: Morteza Mirmojarabian
tagline: Practical English. Clear explanations. Better conversations.
description: English language articles and interactive practice for learners.
url: "https://mortezamirmojarabian.github.io"
baseurl: ""
lang: en
locale: en_US

# Contact and social details. Leave a value blank to hide that link.
email: "morteza.mirmojarabian@gmail.com"
telegram_url: "https://t.me/MirmojarabianMorteza"
x_username: "Mirmojarabian"

# Project destinations were not included in the brief; add them when ready.
html_editor_url: "https://htmleditor.gitlab.io/"
ili_library_url: "https://iliteacherslibrary.github.io/"

# Blog pagination is generated by the small local plugin in _plugins/.
blog:
  posts_per_page: 3

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: /blog/:title/
timezone: Europe/Amsterdam

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep the published site limited to the intended content and generated assets.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - .github
  - build_site.py
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Morteza Mirmojarabian
      comments: false
