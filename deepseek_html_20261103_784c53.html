---
layout: default
---

<article class="post container">
  <header class="post-header">
    <p class="eyebrow">Article</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a
      class="btn btn-small"
      href="https://x.com/intent/tweet?text={{ page.title | url_encode }}&url={{ page.url | absolute_url | url_encode }}"
      target="_blank"
      rel="noopener"
    >
      Share on X
    </a>
    <a class="text-link" href="{{ '/blog/' | relative_url }}">← Back to blog</a>
  </footer>
</article>
