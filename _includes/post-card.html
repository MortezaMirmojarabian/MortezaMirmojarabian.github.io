<article class="card post-card">
  <div class="post-card-meta">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %d, %Y" }}</time>
    <span aria-hidden="true">&middot;</span>
    {% if include.post.category == "exercises" %}
      <span class="badge badge-exercise">Interactive exercise</span>
    {% else %}
      <span class="badge">Article</span>
    {% endif %}
  </div>
  <h3 class="post-card-title">
    <a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a>
  </h3>
  <p>{{ include.post.excerpt | strip_html | strip }}</p>
  <a class="read-more" href="{{ include.post.url | relative_url }}">Read &rarr;</a>
</article>
