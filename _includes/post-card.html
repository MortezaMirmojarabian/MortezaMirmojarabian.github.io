<article class="post-card">
  <div class="post-card-meta">
    <time class="post-card-date" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
    {% assign card_category = include.post.category | default: 'article' %}
    <span class="badge badge-{{ card_category }}">{{ card_category | capitalize }}</span>
  </div>

  <div class="post-card-body">
    <h3 class="post-card-title">
      <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
    </h3>
    {% if include.post.excerpt %}
      <p class="post-card-excerpt">{{ include.post.excerpt | strip_html | truncatewords: 24 }}</p>
    {% endif %}
  </div>

  <span class="post-card-arrow" aria-hidden="true">&rarr;</span>
</article>
