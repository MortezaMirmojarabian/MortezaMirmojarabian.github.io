<article class="card post-card">
  <div class="post-meta">
    <span class="badge badge-{{ include.post.categories | first }}">{{ include.post.categories | first | capitalize }}</span>
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
  </div>
  <h3 class="post-title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <p class="post-excerpt">{{ include.post.excerpt | strip_html | strip_newlines | truncate: 165 }}</p>
  <a class="card-link" href="{{ include.post.url | relative_url }}">Read more &rarr;</a>
</article>
