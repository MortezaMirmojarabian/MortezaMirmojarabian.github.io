{%- assign x_ready = false -%}
{%- if site.x_username and site.x_username != 'your_x_username' -%}{%- assign x_ready = true -%}{%- endif -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<script>
  /* Apply the saved (or system) theme before first paint, so the page never flashes. */
  (function () {
    document.documentElement.classList.add('js');
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && t === 'dark') m.setAttribute('content', '#09090b');
  })();
</script>
