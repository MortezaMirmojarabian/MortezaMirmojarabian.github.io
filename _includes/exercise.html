{% assign exercise = include.exercise %}
<div class="exercise-card">
  <div class="exercise-heading">
    <span class="exercise-icon" aria-hidden="true">?</span>
    <div><p class="eyebrow">Quick practice</p><h2>{{ exercise.title | default: 'Try it yourself' | escape }}</h2></div>
  </div>
  <form class="exercise-form" data-exercise data-answer-index="{{ exercise.answer }}">
    <fieldset>
      <legend>{{ exercise.question | escape }}</legend>
      {% for choice in exercise.choices %}
        <label class="choice" for="{{ include.id }}-choice-{{ forloop.index0 }}">
          <input id="{{ include.id }}-choice-{{ forloop.index0 }}" type="radio" name="{{ include.id }}-answer" value="{{ forloop.index0 }}" required>
          <span>{{ choice | escape }}</span>
        </label>
      {% endfor %}
    </fieldset>
    <button class="button button-dark exercise-submit" type="submit">Check answer <span aria-hidden="true">→</span></button>
    <p class="exercise-feedback" data-feedback role="status" aria-live="polite" hidden></p>
    <button class="exercise-reset" type="reset" data-reset hidden>Try again</button>
  </form>
  <noscript><p class="form-note">Enable JavaScript to check your answer interactively.</p></noscript>
</div>
