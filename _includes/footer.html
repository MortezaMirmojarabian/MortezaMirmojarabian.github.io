<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-top">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="brand-mark" src="{{ '/assets/img/logo-mark.png' | relative_url }}" alt="" width="34" height="26">
        <span class="brand-name">{{ site.title }}</span>
      </a>
      {% include follow-x.html %}
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author.name | default: site.title }}</p>
      <nav class="footer-contact" aria-label="Contact">
        <span class="footer-contact-label">Contact</span>
        <a href="https://t.me/{{ site.telegram }}" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#i-telegram"/></svg>Telegram<span class="sr-only"> (opens in a new tab)</span></a>
        <a href="mailto:{{ site.email }}"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Email</a>
      </nav>
    </div>
  </div>
</footer>
