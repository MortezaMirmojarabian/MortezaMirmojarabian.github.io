<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <a class="footer-logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — home">
          <span class="footer-logo-chip"><img src="{{ '/favicon.png' | relative_url }}" alt="" width="22" height="22"></span>
          <strong>{{ site.title }}</strong>
        </a>
        <p class="footer-tagline">{{ site.tagline }}.</p>
      </div>

      <nav class="footer-col" aria-label="Footer — pages">
        <h2 class="footer-heading">Pages</h2>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
      </nav>

      <div class="footer-col">
        <h2 class="footer-heading">Elsewhere</h2>
        <a href="https://twitter.com/intent/follow?screen_name={{ site.twitter_username }}" target="_blank" rel="noopener">Follow on X</a>
        <a href="https://t.me/{{ site.telegram_username }}" target="_blank" rel="noopener">Telegram</a>
        <a href="mailto:{{ site.email }}">Email</a>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
      <p>Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a> &middot; Hosted on <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a></p>
    </div>
  </div>
</footer>
