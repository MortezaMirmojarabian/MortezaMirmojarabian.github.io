<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <img src="{{ '/assets/favicon.png' | relative_url }}" alt="" width="32" height="32">
      <div>
        <p class="footer-title">{{ site.title }}</p>
        <p class="footer-note">&copy; {{ 'now' | date: "%Y" }} &middot; Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a></p>
      </div>
    </div>
    <nav class="footer-links" aria-label="Footer">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a class="btn btn-x btn-sm" href="https://x.com/intent/follow?screen_name={{ site.author.twitter }}" target="_blank" rel="noopener">{% include icon-x.html %}<span>Follow on X</span></a>
    </nav>
  </div>
</footer>
