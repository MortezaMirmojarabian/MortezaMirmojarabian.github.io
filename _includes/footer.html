<footer class="site-footer">
  <div class="container site-footer-inner">
    <p class="footer-copy">&copy; {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
    <div class="footer-social">
      {% if site.telegram_username %}
        <a class="footer-social-link" href="https://t.me/{{ site.telegram_username }}" target="_blank" rel="me noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          Telegram
        </a>
      {% endif %}
      {% if site.email %}
        <a class="footer-social-link" href="mailto:{{ site.email }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
          Email
        </a>
      {% endif %}
      {% if site.twitter_username %}
        <a class="footer-social-link" href="https://x.com/{{ site.twitter_username }}" target="_blank" rel="me noopener">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Follow on X
        </a>
      {% endif %}
    </div>
  </div>
</footer>
