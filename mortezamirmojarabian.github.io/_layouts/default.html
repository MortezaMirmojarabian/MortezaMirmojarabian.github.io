<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon.ico' | relative_url }}">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
      <nav>
        <ul>
          <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
          <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
    <div class="social-links">
      <a href="https://twitter.com/{{ site.twitter_username }}" target="_blank" rel="noopener">Follow X (Twitter)</a>
      <a href="https://twitter.com/intent/tweet?text=Check%20out%20this%20website&url={{ site.url }}{% if page.url %}{{ page.url }}{% endif %}" target="_blank" rel="noopener">Share X (Twitter)</a>
    </div>
  </footer>

</body>
</html>
