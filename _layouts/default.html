<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta name="theme-color" content="#f7f8fa">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-frame">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name }} — Home">
          <span class="brand-mark" aria-hidden="true">m<span>/</span></span>
          <span class="brand-name">{{ site.data.profile.name }}<small>English learning, thoughtfully</small></span>
        </a>
        <nav class="primary-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}aria-current="page"{% endif %}>Blog <span class="nav-arrow" aria-hidden="true">↗</span></a>
        </nav>
      </header>

      <main id="main" tabindex="-1">{{ content }}</main>

      <footer class="site-footer">
        <a class="footer-mark" href="{{ '/' | relative_url }}">m<span>/</span></a>
        <p>Clear words. Better conversations.</p>
        <a class="footer-social" href="https://x.com/{{ site.data.profile.x_username | uri_escape }}" target="_blank" rel="noopener noreferrer">Follow on X <span aria-hidden="true">↗</span></a>
        <span class="footer-copy">© {{ 'now' | date: '%Y' }} {{ site.data.profile.name }}</span>
      </footer>
    </div>
  </body>
</html>
